[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-advisor"
version = "0.1.0"
description = "Evidence-driven AI model, reasoning-effort, and execution-mode advisor"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael Vu" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.0"]

[project.scripts]
ai-model-advisor = "tools.ai_model_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools.ai_model_advisor*"]
namespaces = true

[tool.setuptools.package-data]
"tools.ai_model_advisor" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
