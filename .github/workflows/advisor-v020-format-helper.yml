name: Advisor v0.20 format helper

on:
  push:
    branches:
      - feature/ai-model-advisor-v0.20-clean

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format Advisor v0.20 core files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-advisor-v0.20-clean
      - uses: astral-sh/setup-uv@v4
      - name: Install formatter
        run: uv sync --project core --group dev
      - name: Format touched core files
        run: uv run --project core ruff format core/framework/config.py core/tests/test_config.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/framework/config.py core/tests/test_config.py
          git commit -m "style: format Advisor v0.20 core files"
          git push origin HEAD:feature/ai-model-advisor-v0.20-clean
