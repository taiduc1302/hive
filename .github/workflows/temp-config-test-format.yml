name: Temporary Config Test Format

on:
  push:
    branches:
      - feature/ai-model-advisor-v0.20-post-merge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-advisor-v0.20-post-merge
      - uses: astral-sh/setup-uv@v4
      - name: Format config regression tests
        run: |
          uv run --project core ruff format core/tests/test_config.py
          git diff --check
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/tests/test_config.py
          git commit -m "style: format subscription fallback regression tests"
          git push origin HEAD:feature/ai-model-advisor-v0.20-post-merge
