name: AI Model Advisor

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ai_model_advisor/**"
      - "tests/test_ai_model_advisor*.py"
      - "skills/ai-model-advisor/**"
      - "docs/AI_MODEL_ADVISOR.md"
      - "docs/AI_MODEL_ADVISOR_EXPERIMENTS.md"
      - "docs/AI_MODEL_ADVISOR_CONFIGURATION_ROUTING.md"
      - "docs/AI_MODEL_ADVISOR_RUNNER.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_ADAPTER.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_PREVIEW.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_GATE.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_RECEIPT.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_LIFECYCLE.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_ROLLBACK.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_JOURNAL.md"
      - "docs/AI_MODEL_ADVISOR_HIVE_PROMOTION_CHECKPOINT.md"
      - "docs/AI_MODEL_ADVISOR_RUNTIME_CAPABILITIES.md"
      - "docs/AI_MODEL_ADVISOR_EXECUTION_TARGETS.md"
      - "docs/AI_MODEL_ADVISOR_ROUTING_PROPOSALS.md"
      - "docs/AI_MODEL_ADVISOR_PROMOTION_PLANS.md"
      - "docs/AI_MODEL_ADVISOR_CANARY_EVALUATION.md"
      - "docs/AI_MODEL_ADVISOR_PROMOTION_REVIEW.md"
      - "docs/CHATGPT_MODEL_ADVISOR_SETUP.md"
      - "core/framework/config.py"
      - "core/tests/test_config.py"
      - ".github/workflows/ai-model-advisor.yml"
  schedule:
    # 07:05 America/Vancouver during PDT. GitHub cron uses UTC.
    - cron: "5 14 * * *"

permissions:
  contents: read

jobs:
  model-watch-and-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pytest ruff

      - name: Lint advisor and Hive adapter files
        run: ruff check tools/ai_model_advisor tests/test_ai_model_advisor*.py core/framework/config.py core/tests/test_config.py

      - name: Run advisor tests
        run: python -m pytest tests/test_ai_model_advisor*.py

      - name: Smoke-test Hive runtime capability probe
        run: |
          mkdir -p model-advisor-output
          python -m tools.ai_model_advisor.runtime_capabilities \
            > model-advisor-output/hive-runtime-capabilities.md
          python -m tools.ai_model_advisor.runtime_capabilities --json \
            > model-advisor-output/hive-runtime-capabilities.json

      - name: Restore previous source baseline
        uses: actions/cache/restore@v4
        with:
          path: .model-advisor-cache/source-baseline.json
          key: ai-model-advisor-baseline-${{ github.run_id }}
          restore-keys: |
            ai-model-advisor-baseline-

      - name: Scan official model sources
        shell: bash
        run: |
          mkdir -p model-advisor-output .model-advisor-cache
          baseline_args=()
          if [ -f .model-advisor-cache/source-baseline.json ]; then
            baseline_args=(--baseline .model-advisor-cache/source-baseline.json)
          fi
          python -m tools.ai_model_advisor.cli scan \
            "${baseline_args[@]}" \
            --output model-advisor-output/source-scan.md \
            --json-output model-advisor-output/source-scan.json \
            --write-baseline model-advisor-output/source-baseline.json
          cp model-advisor-output/source-baseline.json .model-advisor-cache/source-baseline.json

      - name: Save current source baseline
        uses: actions/cache/save@v4
        with:
          path: .model-advisor-cache/source-baseline.json
          key: ai-model-advisor-baseline-${{ github.run_id }}

      - name: Build profile from public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.ai_model_advisor.cli profile \
            --github-user "${GITHUB_REPOSITORY_OWNER}" \
            --output model-advisor-output/github-workload.json

      - name: Generate recommendations
        run: |
          python -m tools.ai_model_advisor.cli recommend \
            --profile model-advisor-output/github-workload.json \
            --output model-advisor-output/recommendation.md \
            --json-output model-advisor-output/recommendation.json

      - name: Generate task routing matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.ai_model_advisor.cli matrix \
            --github-user "${GITHUB_REPOSITORY_OWNER}" \
            --output model-advisor-output/routing-matrix.md \
            --json-output model-advisor-output/routing-matrix.json

      - name: Generate deterministic controlled experiment smoke plan
        run: |
          python -m tools.ai_model_advisor.cli experiment-plan \
            --input tools/ai_model_advisor/sample_activity.json \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/experiment-plan.md \
            --json-output model-advisor-output/experiment-plan.json

      - name: Bind experiment plan to Hive execution target
        run: |
          python -m tools.ai_model_advisor.experiment_target \
            --plan model-advisor-output/experiment-plan.json \
            --host hive \
            --output model-advisor-output/experiment-plan.hive.json

      - name: Smoke-test Hive experiment preflight
        shell: bash
        run: |
          experiment_id="$(python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("model-advisor-output/experiment-plan.hive.json").read_text())
          pairs = [pair for category in plan.get("categories", []) for pair in category.get("pairs", [])]
          if not pairs:
              raise SystemExit("experiment plan did not produce a pair for Hive preflight smoke test")
          print(pairs[0]["experiment_id"])
          PY
          )"
          python -m tools.ai_model_advisor.hive_experiment_preflight \
            --plan model-advisor-output/experiment-plan.hive.json \
            --experiment-id "$experiment_id" \
            > model-advisor-output/hive-experiment-preflight-smoke.md
          python -m tools.ai_model_advisor.hive_experiment_preflight \
            --plan model-advisor-output/experiment-plan.hive.json \
            --experiment-id "$experiment_id" \
            --json \
            > model-advisor-output/hive-experiment-preflight-smoke.json

      - name: Bind experiment plan to direct provider execution target
        run: |
          python -m tools.ai_model_advisor.experiment_target \
            --plan model-advisor-output/experiment-plan.json \
            --host provider_api \
            --output model-advisor-output/experiment-plan.provider-api.json

      - name: Smoke-test direct provider experiment preflight offline
        shell: bash
        env:
          OPENAI_API_KEY: ci-placeholder-no-network-call
          ANTHROPIC_API_KEY: ci-placeholder-no-network-call
        run: |
          experiment_id="$(python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("model-advisor-output/experiment-plan.provider-api.json").read_text())
          pairs = [pair for category in plan.get("categories", []) for pair in category.get("pairs", [])]
          if not pairs:
              raise SystemExit("experiment plan did not produce a pair for provider preflight smoke test")
          print(pairs[0]["experiment_id"])
          PY
          )"
          python -m tools.ai_model_advisor.provider_experiment_preflight \
            --plan model-advisor-output/experiment-plan.provider-api.json \
            --experiment-id "$experiment_id" \
            > model-advisor-output/provider-experiment-preflight-smoke.md
          python -m tools.ai_model_advisor.provider_experiment_preflight \
            --plan model-advisor-output/experiment-plan.provider-api.json \
            --experiment-id "$experiment_id" \
            --json \
            > model-advisor-output/provider-experiment-preflight-smoke.json

      - name: Smoke-test controlled experiment runner preview
        shell: bash
        run: |
          experiment_id="$(python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("model-advisor-output/experiment-plan.json").read_text())
          pairs = [pair for category in plan.get("categories", []) for pair in category.get("pairs", [])]
          if not pairs:
              raise SystemExit("experiment plan did not produce a pair for runner preview smoke test")
          print(pairs[0]["experiment_id"])
          PY
          )"
          python -m tools.ai_model_advisor.experiment_run_cli \
            --plan model-advisor-output/experiment-plan.json \
            --experiment-id "$experiment_id" \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --task "CI preview only: no model or provider execution is allowed." \
            --output model-advisor-output/experiment-run-preview-smoke.md \
            --json-output model-advisor-output/experiment-run-preview-smoke.json

      - name: Smoke-test controlled experiment evaluator
        run: |
          python -m tools.ai_model_advisor.cli experiment-evaluate \
            --plan model-advisor-output/experiment-plan.json \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/experiment-evaluation-smoke.md \
            --json-output model-advisor-output/experiment-evaluation-smoke.json

      - name: Smoke-test experiment impact analysis
        run: |
          python -m tools.ai_model_advisor.cli experiment-impact \
            --plan model-advisor-output/experiment-plan.json \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/experiment-impact-smoke.md \
            --json-output model-advisor-output/experiment-impact-smoke.json

      - name: Smoke-test feedback evidence commands
        run: |
          python -m tools.ai_model_advisor.cli feedback-report \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/feedback-audit-smoke.md \
            --json-output model-advisor-output/feedback-audit-smoke.json
          python -m tools.ai_model_advisor.cli feedback-readiness \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/feedback-readiness-smoke.md \
            --json-output model-advisor-output/feedback-readiness-smoke.json

      - name: Smoke-test empirical routing review commands
        run: |
          python -m tools.ai_model_advisor.cli feedback-leaderboard \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/empirical-leaderboard-smoke.md \
            --json-output model-advisor-output/empirical-leaderboard-smoke.json
          python -m tools.ai_model_advisor.cli routing-proposals \
            --routing-matrix model-advisor-output/routing-matrix.json \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/routing-proposals-smoke.md \
            --json-output model-advisor-output/routing-proposals-smoke.json
          python -m tools.ai_model_advisor.promotion_plan_cli \
            --routing-matrix model-advisor-output/routing-matrix.json \
            --feedback model-advisor-output/empty-feedback.jsonl \
            --output model-advisor-output/promotion-plan-smoke.md \
            --json-output model-advisor-output/promotion-plan-smoke.json

      - name: Smoke-test promotion review package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("model-advisor-output")
          matrix = {
              "routing_matrix": [
                  {
                      "category": "debugging",
                      "primary": {
                          "provider": "test",
                          "model_id": "current-model",
                          "label": "Current Model",
                          "effort": "high",
                          "execution_mode": "single",
                      },
                      "alternatives": [],
                  }
              ]
          }
          canary = {
              "automatic_policy_mutation": False,
              "automatic_rollback": False,
              "evaluations": [
                  {
                      "category": "debugging",
                      "state": "eligible_for_manual_promotion",
                      "current": {
                          "provider": "test",
                          "model_id": "current-model",
                          "effort": "high",
                          "execution_mode": "single",
                      },
                      "candidate": {
                          "provider": "test",
                          "model_id": "candidate-model",
                          "effort": "high",
                          "execution_mode": "single",
                      },
                      "required_pairs": 3,
                      "matched_pairs": 3,
                      "leaderboard_status": "promote",
                      "winner_matches_candidate": True,
                      "safe_to_apply": False,
                      "requires_human_approval": True,
                  }
              ],
          }
          (out / "promotion-review-matrix.json").write_text(
              json.dumps(matrix), encoding="utf-8"
          )
          (out / "promotion-review-canary.json").write_text(
              json.dumps(canary), encoding="utf-8"
          )
          PY
          python -m tools.ai_model_advisor.cli promotion-review \
            --canary-evaluation model-advisor-output/promotion-review-canary.json \
            --routing-matrix model-advisor-output/promotion-review-matrix.json \
            --output model-advisor-output/promotion-review-smoke.md \
            --json-output model-advisor-output/promotion-review-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("model-advisor-output/promotion-review-smoke.json").read_text()
          )
          assert report["ready_changes"] == 1
          assert report["reviews"][0]["state"] == "ready_for_manual_edit"
          assert report["safe_to_apply"] is False
          assert report["automatic_policy_mutation"] is False
          PY

      - name: Smoke-test Hive promotion config preview
        run: |
          python -m tools.ai_model_advisor.cli hive-promotion-preview \
            --promotion-review model-advisor-output/promotion-review-smoke.json \
            --category debugging \
            --scope queen \
            --output model-advisor-output/hive-promotion-preview-smoke.md \
            --json-output model-advisor-output/hive-promotion-preview-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          preview = json.loads(
              Path("model-advisor-output/hive-promotion-preview-smoke.json").read_text()
          )
          assert preview["state"] == "ready_for_manual_hive_edit"
          assert preview["safe_to_auto_apply"] is False
          assert preview["automatic_config_mutation"] is False
          assert preview["promotion_review_sha256"]
          assert preview["apply_patch"]["llm"]["model"] == "candidate-model"
          assert preview["rollback_patch"]["llm"]["model"] == "current-model"
          PY

      - name: Smoke-test Hive promotion runtime gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          capabilities = {
              "schema_version": 1,
              "host": "hive",
              "litellm": {
                  "repository_pin": {"version": "1.83.4", "source": "pyproject.toml"},
                  "installed_version": "1.83.4",
                  "versions_match": True,
              },
              "transport": {"single_call_evidence_ready": True},
              "native_config": {"reasoning_effort_passthrough": True},
          }
          evidence = {
              "schema_version": 1,
              "transport": "hive_litellm",
              "litellm_version": "1.83.4",
              "applied_configuration": {
                  "provider": "test",
                  "model_id": "candidate-model",
                  "effort": "high",
                  "execution_mode": "single",
              },
              "outcome": "partial",
              "response_text": "SMOKE_RESPONSE_MUST_NOT_LEAK",
          }
          out = Path("model-advisor-output")
          (out / "hive-promotion-gate-capabilities.json").write_text(
              json.dumps(capabilities), encoding="utf-8"
          )
          (out / "hive-promotion-gate-evidence.json").write_text(
              json.dumps(evidence), encoding="utf-8"
          )
          PY
          python -m tools.ai_model_advisor.cli hive-promotion-gate \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --runtime-capabilities model-advisor-output/hive-promotion-gate-capabilities.json \
            --hive-evidence model-advisor-output/hive-promotion-gate-evidence.json \
            --require-ready \
            --output model-advisor-output/hive-promotion-gate-smoke.md \
            --json-output model-advisor-output/hive-promotion-gate-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("model-advisor-output/hive-promotion-gate-smoke.json")
          raw = path.read_text()
          gate = json.loads(raw)
          assert gate["state"] == "runtime_ready_for_manual_hive_edit"
          assert gate["ready"] is True
          assert gate["safe_to_auto_apply"] is False
          assert gate["automatic_config_mutation"] is False
          assert "SMOKE_RESPONSE_MUST_NOT_LEAK" not in raw
          PY

      - name: Smoke-test Hive promotion verification receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = {
              "llm": {
                  "provider": "test",
                  "model": "candidate-model",
                  "reasoning_effort": "high",
                  "api_key": "SMOKE_SECRET_MUST_NOT_LEAK",
              }
          }
          import os

          target = Path(os.environ["RUNNER_TEMP"]) / "hive-config-after-smoke.json"
          target.write_text(json.dumps(config), encoding="utf-8")
          PY
          python -m tools.ai_model_advisor.cli hive-promotion-receipt \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --hive-config "$RUNNER_TEMP/hive-config-after-smoke.json" \
            --output model-advisor-output/hive-promotion-receipt-smoke.md \
            --json-output model-advisor-output/hive-promotion-receipt-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path(
              "model-advisor-output/hive-promotion-receipt-smoke.json"
          )
          raw = receipt_path.read_text()
          receipt = json.loads(raw)
          assert receipt["state"] == "applied_exactly"
          assert receipt["automatic_config_mutation"] is False
          assert receipt["safe_to_auto_mutate"] is False
          assert receipt["receipt_sha256"]
          assert "SMOKE_SECRET_MUST_NOT_LEAK" not in raw
          PY

      - name: Smoke-test Hive promotion lifecycle audit
        run: |
          python -m tools.ai_model_advisor.cli hive-promotion-lifecycle \
            --promotion-review model-advisor-output/promotion-review-smoke.json \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --runtime-gate model-advisor-output/hive-promotion-gate-smoke.json \
            --promotion-receipt model-advisor-output/hive-promotion-receipt-smoke.json \
            --require-applied-verified \
            --output model-advisor-output/hive-promotion-lifecycle-smoke.md \
            --json-output model-advisor-output/hive-promotion-lifecycle-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          lifecycle_path = Path(
              "model-advisor-output/hive-promotion-lifecycle-smoke.json"
          )
          lifecycle = json.loads(lifecycle_path.read_text())
          assert lifecycle["state"] == "applied_verified"
          assert lifecycle["applied_verified"] is True
          assert lifecycle["ready_for_manual_hive_edit"] is False
          assert lifecycle["automatic_config_mutation"] is False
          assert lifecycle["automatic_rollback"] is False
          assert lifecycle["artifact_hashes"]["promotion_review_sha256"]
          assert lifecycle["artifact_hashes"]["promotion_preview_sha256"]
          assert lifecycle["artifact_hashes"]["runtime_gate_sha256"]
          assert lifecycle["artifact_hashes"]["promotion_receipt_sha256"]
          PY

      - name: Smoke-test Hive promotion rollback audit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "llm": {
                  "provider": "test",
                  "model": "current-model",
                  "reasoning_effort": "high",
                  "api_key": "ROLLBACK_SMOKE_SECRET_MUST_NOT_LEAK",
              }
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "hive-config-rollback-smoke.json"
          target.write_text(json.dumps(config), encoding="utf-8")
          PY
          python -m tools.ai_model_advisor.cli hive-promotion-receipt \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --hive-config "$RUNNER_TEMP/hive-config-rollback-smoke.json" \
            --previous-receipt model-advisor-output/hive-promotion-receipt-smoke.json \
            --output model-advisor-output/hive-promotion-rollback-receipt-smoke.md \
            --json-output model-advisor-output/hive-promotion-rollback-receipt-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "model-advisor-output/hive-promotion-rollback-receipt-smoke.json"
          )
          raw = path.read_text()
          receipt = json.loads(raw)
          assert receipt["state"] == "not_applied"
          assert receipt["previous_receipt_sha256"]
          assert "ROLLBACK_SMOKE_SECRET_MUST_NOT_LEAK" not in raw
          PY
          python -m tools.ai_model_advisor.cli hive-promotion-rollback \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --applied-lifecycle model-advisor-output/hive-promotion-lifecycle-smoke.json \
            --rollback-receipt model-advisor-output/hive-promotion-rollback-receipt-smoke.json \
            --require-rolled-back-verified \
            --output model-advisor-output/hive-promotion-rollback-smoke.md \
            --json-output model-advisor-output/hive-promotion-rollback-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          rollback = json.loads(
              Path("model-advisor-output/hive-promotion-rollback-smoke.json").read_text()
          )
          assert rollback["state"] == "rolled_back_verified"
          assert rollback["rolled_back_verified"] is True
          assert rollback["automatic_rollback"] is False
          assert rollback["automatic_config_mutation"] is False
          assert rollback["artifact_hashes"]["promotion_preview_sha256"]
          assert rollback["artifact_hashes"]["applied_lifecycle_sha256"]
          assert rollback["artifact_hashes"]["rollback_receipt_sha256"]
          PY

      - name: Smoke-test Hive promotion journal
        run: |
          python -m tools.ai_model_advisor.cli hive-promotion-journal init \
            --promotion-preview model-advisor-output/hive-promotion-preview-smoke.json \
            --output model-advisor-output/hive-promotion-journal-preview-smoke.md \
            --json-output model-advisor-output/hive-promotion-journal-preview-smoke.json
          python -m tools.ai_model_advisor.cli hive-promotion-journal append \
            --journal model-advisor-output/hive-promotion-journal-preview-smoke.json \
            --event applied_lifecycle \
            --artifact model-advisor-output/hive-promotion-lifecycle-smoke.json \
            --output model-advisor-output/hive-promotion-journal-applied-smoke.md \
            --json-output model-advisor-output/hive-promotion-journal-applied-smoke.json
          python -m tools.ai_model_advisor.cli hive-promotion-journal append \
            --journal model-advisor-output/hive-promotion-journal-applied-smoke.json \
            --event rollback_audit \
            --artifact model-advisor-output/hive-promotion-rollback-smoke.json \
            --output model-advisor-output/hive-promotion-journal-smoke.md \
            --json-output model-advisor-output/hive-promotion-journal-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          journal = json.loads(
              Path("model-advisor-output/hive-promotion-journal-smoke.json").read_text()
          )
          assert journal["state"] == "rolled_back_verified"
          assert len(journal["entries"]) == 3
          assert journal["entries"][0]["event"] == "promotion_preview"
          assert journal["entries"][1]["event"] == "applied_lifecycle"
          assert journal["entries"][2]["event"] == "rollback_audit"
          assert journal["head_entry_sha256"] == journal["entries"][-1]["entry_sha256"]
          assert journal["automatic_config_mutation"] is False
          assert journal["automatic_rollback"] is False
          PY

      - name: Smoke-test Hive promotion journal checkpoint
        shell: bash
        run: |
          python -m tools.ai_model_advisor.hive_promotion_checkpoint create \
            --journal model-advisor-output/hive-promotion-journal-smoke.json \
            --output model-advisor-output/hive-promotion-checkpoint-smoke.md \
            --json-output model-advisor-output/hive-promotion-checkpoint-smoke.json
          python -m tools.ai_model_advisor.hive_promotion_checkpoint verify \
            --journal model-advisor-output/hive-promotion-journal-smoke.json \
            --checkpoint model-advisor-output/hive-promotion-checkpoint-smoke.json \
            --output model-advisor-output/hive-promotion-checkpoint-verify-smoke.md \
            --json-output model-advisor-output/hive-promotion-checkpoint-verify-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("model-advisor-output/hive-promotion-checkpoint-smoke.json").read_text()
          )
          report = json.loads(
              Path("model-advisor-output/hive-promotion-checkpoint-verify-smoke.json").read_text()
          )
          assert checkpoint["entry_count"] == 3
          assert checkpoint["head_entry_sha256"]
          assert checkpoint["journal_sha256"]
          assert checkpoint["checkpoint_sha256"]
          assert report["verified"] is True
          assert report["status"] == "verified"
          assert report["automatic_config_mutation"] is False
          assert report["automatic_rollback"] is False
          PY
          set +e
          python -m tools.ai_model_advisor.hive_promotion_checkpoint verify \
            --journal model-advisor-output/hive-promotion-journal-preview-smoke.json \
            --checkpoint model-advisor-output/hive-promotion-checkpoint-smoke.json \
            --json-output model-advisor-output/hive-promotion-checkpoint-mismatch-smoke.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("model-advisor-output/hive-promotion-checkpoint-mismatch-smoke.json").read_text()
          )
          assert report["verified"] is False
          assert report["status"] == "mismatch"
          fields = {item["field"] for item in report["mismatches"]}
          assert "entry_count" in fields
          assert "head_entry_sha256" in fields
          assert "journal_sha256" in fields
          PY

