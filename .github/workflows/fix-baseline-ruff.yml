name: Fix Baseline Ruff

on:
  push:
    branches:
      - fix/baseline-ruff
    paths:
      - "scripts/fix_baseline_ruff.py"
      - ".github/workflows/fix-baseline-ruff.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply Ruff safe fixes
        run: ruff check --fix core/ || true

      - name: Apply guarded runtime fixes
        run: python scripts/fix_baseline_ruff.py

      - name: Verify baseline lint is clean
        run: ruff check core/

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/
          git commit -m "fix: resolve baseline ruff errors"
          git push origin HEAD:fix/baseline-ruff
