name: Format v0.19 Advisor tree

on:
  push:
    branches:
      - feature/ai-model-advisor-v0.19-clean
    paths:
      - ".github/workflows/format-v019-advisor.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-model-advisor-v0.19-clean
      - uses: astral-sh/setup-uv@v4
      - name: Format Advisor tree with locked Ruff
        run: uv run --project core ruff format tools/ai_model_advisor
      - name: Commit formatter output
        run: |
          if git diff --quiet -- tools/ai_model_advisor; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ai_model_advisor
          git commit -m "style: format v0.19 Advisor tree"
          git push
