name: Advisor Format Diff

on:
  push:
    paths:
      - "core/tests/test_config.py"
      - ".github/workflows/advisor-format-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --project core --group dev
      - name: Show locked Ruff format diff
        run: uv run --project core ruff format --diff core/tests/test_config.py
