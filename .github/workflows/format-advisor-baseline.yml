name: Format Advisor Baseline

on:
  push:
    branches:
      - fix/advisor-ruff-format-baseline

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisor-ruff-format-baseline
      - uses: astral-sh/setup-uv@v4
      - name: Sync locked formatter
        run: uv sync --project core --group dev
      - name: Format Advisor package
        run: uv run --project core ruff format tools/ai_model_advisor
      - name: Verify Advisor package
        run: |
          uv run --project core ruff check tools/ai_model_advisor
          uv run --project core ruff format --check tools/ai_model_advisor
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ai_model_advisor
          if ! git diff --cached --quiet; then
            git commit -m "style: format AI Model Advisor with locked Ruff"
            git push
          fi
