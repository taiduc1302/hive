name: Format Advisor baseline

on:
  push:
    branches:
      - fix/advisor-ruff-format-015
    paths:
      - ".github/workflows/format-advisor-baseline.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisor-ruff-format-015
      - uses: astral-sh/setup-uv@v4
      - name: Format Advisor with locked Ruff
        run: uv run --project core ruff format tools/ai_model_advisor
      - name: Commit formatter output
        run: |
          if git diff --quiet -- tools/ai_model_advisor; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ai_model_advisor
          git commit -m "style: format AI Model Advisor with Ruff 0.15.0"
          git push
